[project]
name = "pfs_target_uploader"
description = "Target uploader for PFS openuse"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Masato Onodera", email = "monodera@naoj.org" },
  { name = "Wanqiu He" }
]
dependencies = [
  "astroplan",
  "astropy>=5.3.1",
  "astropy-healpix>=1.1.2",
  "colorcet>=3.0.1",
  "dask>=2023.10.1",
  "datashader>=0.16.0",
  "ets-fiber-assigner @ git+https://github.com/Subaru-PFS/ets_fiberalloc.git@0783d1d22867268d2c0186c717e865999a14b39a",
  "fontawesome-markdown @ https://github.com/bmcorser/fontawesome-markdown/archive/5feb14118d963312d52bb1fdb4c7eefa4da19880.zip",
  "gurobipy>=12,<13",
  "highspy>=1.11",
  "hdbscan>=0.8.40",
  "holoviews>=1.17.1",
  "hvplot>=0.8.4",
  "ics-cobraCharmer @ git+https://github.com/Subaru-PFS/ics_cobraCharmer.git@1.5.9",
  "ics-cobraOps @ git+https://github.com/Subaru-PFS/ics_cobraOps.git@v2.0.7",
  "loguru>=0.7.2",
  "multiprocess>=0.70.15",
  "numpy>=2.4.0",
  "pandas>=2.0.3,<3.0.0",
  "panel>=1.8.0,<1.9.0",
  "pfs-instdata @ git+https://github.com/Subaru-PFS/pfs_instdata.git@1.8.71",
  "pfs-utils @ git+https://github.com/Subaru-PFS/pfs_utils.git@7.4.22",
  "psutil>=6.0.0",
  "python-dotenv>=1.0.0",
  # Pinned to a tag: a bare URL tracks master, and an upgrade previously moved
  # qplan across the commit that relocated EphemerisCache into spot, breaking
  # every entry point. v2.0.0 already contains that move.
  "qplan @ git+https://github.com/naojsoft/qplan.git@v2.0.0",
  "scikit-learn>=1.3.0",
  "seaborn>=0.12.2",
  "skyfield>=1.53",
  "spatialpandas>=0.4.9",
  # Provides EphemerisCache, which qplan moved out of qplan.util into spot.util.
  # qplan pulls it in transitively, but utils/checker.py imports it directly.
  "spot-nik>=1.2.0",
  "typer>=0.12.3",
]
dynamic = ["version"]

[project.scripts]
pfs-uploader-cli = "pfs_target_uploader.cli.cli_main:app"

[project.optional-dependencies]
dev = ["black>=23.7.0", "ruff>=0.5.0", "ty", "ipython>=8.14.0", "pytest>=8.0.0"]
profilers = ["pyinstrument>=4.6.0", "snakeviz>=2.2.0", "memray>=1.10.0"]
# Only scripts/build-doc.sh and scripts/serve-doc.sh need this locally; the
# Docker docs-builder stage and the GitHub Actions doc-build workflows each
# pip-install their own separate, minimal mkdocs environment and never touch
# this extra. Kept out of the base [project].dependencies so the app's own
# venv (and the Docker image built from it) doesn't carry mkdocs-material's
# ~120MB of imaging/i18n dependencies (cairosvg, babel, sphinx via
# myst-parser, ...) that the app itself never imports.
docs = [
  "mkdocs>=1.4.3,<2.0.0",
  "mkdocs-macros-plugin>=0.7.0",
  "mkdocs-material[imaging]>=9.5.4",
  "mkdocs-video>=1.5.0",
  "myst-parser>=2.0.0",
]

[build-system]
requires = ["pybind11", "setuptools>=64", "setuptools-scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
# Override-dependencies resolve conflicting git URLs that arise when transitive
# PFS packages (ics-cobraCharmer, ics-cobraOps, …) require the same packages
# (pfs-utils, pfs-instdata, ics-utils, …) via bare-master git URLs, while this
# project pins them to specific tags.  uv treats different URLs for the same
# package as a hard conflict; the overrides here tell uv which version wins.
#
# IMPORTANT: when updating a tag in [project].dependencies, update the
# corresponding entry here too — otherwise the override silently wins and the
# tag in [project].dependencies has no effect.
override-dependencies = [
    # --- Direct dependencies: keep in sync with [project].dependencies ---
    "pfs-utils @ git+https://github.com/Subaru-PFS/pfs_utils.git@7.4.22",
    "pfs-instdata @ git+https://github.com/Subaru-PFS/pfs_instdata.git@1.8.71",
    "ics-cobraCharmer @ git+https://github.com/Subaru-PFS/ics_cobraCharmer.git@1.5.9",
    "ics-cobraOps @ git+https://github.com/Subaru-PFS/ics_cobraOps.git@v2.0.7",
    # ets-fiber-assigner is pinned to a commit rather than a tag: the HiGHS
    # backend lives on tickets/FIBERALLOC-62, rebased (merged) onto v3.8, and
    # has no tag of its own yet. Move this back to a tag once it lands
    # upstream. The package now correctly reports version 3.8.0 (utils/ppp.py's
    # nf.HighsProblem probe still applies: a plain v3.8 install also reports
    # 3.8.0 but has no HighsProblem).
    "ets-fiber-assigner @ git+https://github.com/Subaru-PFS/ets_fiberalloc.git@0783d1d22867268d2c0186c717e865999a14b39a",
    # --- Transitive dependencies (no tag upstream): pinned to commits in uv.lock
    #     for reproducibility when using `uv pip install -e .` (which bypasses the lock).
    #     Update these hashes when running `uv lock --upgrade-package <name>`. ---
    "ics-utils @ git+https://github.com/Subaru-PFS/ics_utils.git@34179a6fcb40c918b37a1ebbc4fcb4f366feb1b7",
    "spt-operational-database @ git+https://github.com/Subaru-PFS/spt_operational_database.git@cbcbd4b55346bd2abdd3eaa1b0038a04761c2f4a",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
ignore = [
  "F401",  # module imported but unused
  "F841",  # local variable is assigned to but never used
  "E501",  # line too long, handled by black
  "B008",  # do not perform function calls in argument defaults
  "C901",  # too complex
  "N802",  # function name should be lowercase
  "N803",  # argument name should be lowercase
  "N806",  # variable in function should be lowercase
  "N815",  # variable in class should be lowercase
  "N816",  # attribute in class should be lowercase
  "EM101",  # use 'isinstance()' instead of comparing types directly
  "TRY003",  # unnecessary except block
]
# select = [
#     "E",  # pycodestyle errors
#     "W",  # pycodestyle warnings
#     "F",  # pyflakes
#     "I",  # isort
#     "B",  # flake8-bugbear
#     "C4", # flake8-comprehensions
#     "UP", # pyupgrade
# ]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools_scm]
version_file = "src/pfs_target_uploader/_version.py"
fallback_version = "0.0.0+unknown"
