[project]
name = "pfs_target_uploader"
dynamic = ["version"]
description = "Target uploader for PFS openuse"
authors = [{ name = "Masato Onodera", email = "monodera@naoj.org" }]
dependencies = [
    "panel<1.7,>=1.6.0",
    "numpy>=2.0.0",
    "astropy>=5.3.1",
    "astroplan",
    "colorcet>=3.0.1",
    "datashader>=0.16.0",
    "dask>=2023.10.1",
    "fontawesome-markdown @ https://github.com/bmcorser/fontawesome-markdown/archive/master.zip",
    "gurobipy>=12,<13",
    "holoviews>=1.17.1",
    "hvplot>=0.8.4",
    "loguru>=0.7.2",
    "mkdocs-macros-plugin>=0.7.0",
    "mkdocs-material[imaging]>=9.5.4",
    "mkdocs-video>=1.5.0",
    "mkdocs>=1.4.3",
    "multiprocess>=0.70.15",
    "myst-parser>=2.0.0",
    "pandas>=2.0.3",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.3.0",
    "seaborn>=0.12.2",
    "spatialpandas>=0.4.9",
    "typer>=0.12.3",
    "psutil>=6.0.0",
    "hdbscan>=0.8.40",
    "skyfield>=1.53",
    "astropy-healpix>=1.1.2",
    "qplan @ git+https://github.com/naojsoft/qplan.git",
    "ets-fiber-assigner @ git+https://github.com/Subaru-PFS/ets_fiberalloc.git",
    "ics-cobraOps @ git+https://github.com/Subaru-PFS/ics_cobraOps.git",
    "ics-cobraCharmer @ git+https://github.com/Subaru-PFS/ics_cobraCharmer.git",
    "pfs-utils @ git+https://github.com/Subaru-PFS/pfs_utils.git",
    "pfs-instdata @ git+https://github.com/Subaru-PFS/pfs_instdata.git",
]
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
pfs-uploader-cli = "pfs_target_uploader.cli.cli_main:app"

[build-system]
requires = ["setuptools", "wheel", "pybind11"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "pfs_target_uploader.__version__" }

[project.optional-dependencies]
dev = ["black>=23.7.0", "ruff>=0.5.0", "ty", "ipython>=8.14.0"]
profilers = ["pyinstrument>=4.6.0", "snakeviz>=2.2.0", "memray>=1.10.0"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
ignore = [
    "F401",   # module imported but unused
    "F841",   # local variable is assigned to but never used
    "E501",   # line too long, handled by black
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
    "N802",   # function name should be lowercase
    "N803",   # argument name should be lowercase
    "N806",   # variable in function should be lowercase
    "N815",   # variable in class should be lowercase
    "N816",   # attribute in class should be lowercase
    "EM101",  # use 'isinstance()' instead of comparing types directly
    "TRY003", # unnecessary except block
]
# select = [
#     "E",  # pycodestyle errors
#     "W",  # pycodestyle warnings
#     "F",  # pyflakes
#     "I",  # isort
#     "B",  # flake8-bugbear
#     "C4", # flake8-comprehensions
#     "UP", # pyupgrade
# ]

[tool.black]
line-length = 88
target-version = ["py312"]

